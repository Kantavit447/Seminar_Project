data_config:
  chunk:
    law_dir: test_data/laws
    node_path: chunking/golden/nodes.json
    tax_data_path: data_splits/tax_engineering_10.csv
    section_idx_path: dump/section_idx.json
    load_wangchan: false

retriever_config:
  human-finetuned-bge-m3:
    model_name: wangchan-rerank-multi
    k: 10

augmenter_config:
  no-ref:
    reference: false
    context_format: common_v3_citation_id_enum

llm_config:
  qwen:
    model: qwen2.5-32k:7b
    max_tokens: 4096
    temperature: 0.0
    seed: 42
    base_url: http://localhost:11434/v1
    api_key: ollama

prompt_version: v3
reasoning_method: direct
citation_mode: provision_id
citation_constraint_mode: enum
citation_validation: true
output_path: results/current/common_interface_v3/diagnostics/direct_v3_citation_id_enum_source_0023_ctx32768_run2
saved_retrieval_path: results/current/retrieval_evaluation/section_based_no_ref/retrieval_results.json
batch_size: 1
device: 0

diagnostic:
  runtime_idx: "0005"
  source_idx: "0023"
  save_raw_on_parse_failure: true
  max_retries: 1
  failure_output_dir: results/current/common_interface_v3/diagnostics/direct_v3_citation_id_enum_length_failure_ctx32768_run2
