    law_dir: test_data/laws
    node_path: chunking/golden/nodes.json
    tax_data_path: data_splits/tax_engineering_10.csv
    section_idx_path: dump/section_idx.json
    load_wangchan: false

retriever_config: {}

augmenter_config:
