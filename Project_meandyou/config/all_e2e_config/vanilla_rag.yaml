data_config:
    chunk: #เอกส่ารฎหมายถูกแบ่งเป็นชิ้นๆแล้ว
          node_path: /app/LRG/chunking/553_50_line/nodes.json
      
retriever_config:
    human-finetuned-bge-m3:
          model_name: wangchan-rerank-multi
          k: 10 #Default  เอา10 chunk ที่ดเกี่ยวข้องที่สุด
      
augmenter_config:
    no-ref:
        reference: False #Default
      
llm_config:
    claude-3.5-sonnet:
          model: claude-3-5-sonnet-20240620
          max_tokens: 2048
          temperature: 0.5
      
output_path: /app/LRG/results/e2e/v0.1/main_table
batch_size: 10
          